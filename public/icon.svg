<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="50%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- playful dots -->
  <circle cx="96" cy="110" r="14" fill="#fb7185"/>
  <circle cx="430" cy="150" r="11" fill="#34d399"/>
  <circle cx="400" cy="400" r="13" fill="#f472b6"/>
  <circle cx="110" cy="410" r="10" fill="#38bdf8"/>
  <!-- star inside the lens -->
  <g>
    <circle cx="222" cy="222" r="118" fill="#ffffff"/>
    <circle cx="222" cy="222" r="118" fill="none" stroke="#a78bfa" stroke-width="22"/>
    <path d="M222 154 240.2 200.9 290.5 203.8 251.5 235.6 264.3 284.2 222 257 179.7 284.2 192.5 235.6 153.5 203.8 203.8 200.9Z" fill="#fbbf24" stroke="#fbbf24" stroke-width="16" stroke-linejoin="round"/>
  </g>
  <!-- magnifier handle -->
  <rect x="300" y="300" width="150" height="46" rx="23" transform="rotate(45 300 300)" fill="#a78bfa"/>
  <rect x="300" y="300" width="150" height="46" rx="23" transform="rotate(45 300 300)" fill="#8b5cf6" opacity="0.25"/>
</svg>
